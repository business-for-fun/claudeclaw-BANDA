# LIMO — logistics/booking (n8n на 10.128.0.3, shared FAM+LIMO host).
# TASK-20260908-001 (Olaf, 2026-09-08): was "10.128.0.7" in this comment and
# in DETECT_REGEX — stale since the 2026-08-19 migration to 10.128.0.3 (see
# BUG-20260819-001). 10.128.0.7 was torn down 2026-08-20 and repurposed for
# the R4G sandbox (sandbox.ready2net.online), an unrelated service. Dropped
# the IP clause from DETECT_REGEX instead of swapping it to 10.128.0.3:
# that address is now shared with FAM, so matching it here would flag every
# FAM-only infra mention as LIMO too — '\blimo\b' alone is the accurate
# detector now that there's no LIMO-exclusive host to key off of.
PROJECT=limo
PROJECT_DIR=projects/limo
CARDS_DIR=projects/limo/cards
DETECT_REGEX='\blimo\b'
DEPLOY_REGEX='deploy|n8n.*(sync|синк)|sync.*n8n'
SYNC_REGEX=''
CODE_OWNERS="'gale','freddie'"
EXECUTORS="'gale','freddie','olaf'"
VERIFY_AGENTS='kim'
MODE=warn
